<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skullcrusher Slots: Falling Stick & Win</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700&display=swap');
        
        body {
            font-family: 'Cinzel', serif;
            background: radial-gradient(circle at 50% 20%, #1f1105 0%, #0d0603 60%, #050201 100%);
            color: #f7e7ce;
            user-select: none;
        }

        .gold-border {
            border: 2px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.35);
        }

        .symbol-card {
            transition: transform 0.25s ease-out, filter 0.2s ease;
        }

        .falling-orb {
            box-shadow: 0 0 20px #ff7b00, inset 0 0 15px #ffd700;
            border: 2px solid #ffcc00;
            animation: orbPulse 1.2s infinite alternate;
        }

        @keyframes orbPulse {
            0% { transform: scale(0.96); filter: drop-shadow(0 0 6px #ff4500); }
            100% { transform: scale(1.04); filter: drop-shadow(0 0 16px #ffd700); }
        }

        .shake {
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .rolling {
            animation: rollBlur 0.15s infinite linear;
        }

        @keyframes rollBlur {
            0% { transform: translateY(-8px); filter: blur(2px); }
            50% { transform: translateY(8px); filter: blur(2px); }
            100% { transform: translateY(-8px); filter: blur(2px); }
        }
    </style>
</head>
